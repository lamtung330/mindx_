<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background: linear-gradient(to right, #74ebd5, #acb6e5);
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .login-card {
        background: white;
        border-radius: 20px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        padding: 40px;
        width: 100%;
        max-width: 400px;
      }
      .form-control {
        border-radius: 10px;
      }
      .btn-primary {
        border-radius: 10px;
      }
      .text-center a {
        text-decoration: none;
        color: #6c757d;
      }
      .text-center a:hover {
        color: #495057;
      }
      .Aula {
        width: 100px;
      }
    </style>
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top">
      <div class="container">
        <a class="navbar-brand" href="home.html">
          <img class="Aula" src="./1-230921155F0X4.png"
        /></a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        ></button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="home.html">Trang chủ </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#courses">Sản phẩm </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#register">Liên hệ </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#contact">Mới </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="signup.html">Đăng ký </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="signup.html">Tìm kiếm </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="login-card">
      <h3 class="text-center mb-4">Đăng Nhập</h3>
      <form>
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input
            type="email"
            class="form-control"
            id="email"
            placeholder="Nhập email của bạn"
          />
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Mật khẩu</label>
          <input
            type="password"
            class="form-control"
            id="password"
            placeholder="Nhập mật khẩu"
          />
        </div>
        <div class="mb-3 form-check">
          <input type="checkbox" class="form-check-input" id="remember" />
          <label class="form-check-label" for="remember"
            >Ghi nhớ đăng nhập</label
          >
        </div>
        <button
          type="button"
          class="btn btn-primary w-100"
          onclick="window.location.href='home.html'"
        >
          Đăng Nhập
        </button>
      </form>
      <p class="text-center mt-3">
        <a href="#">Quên mật khẩu?</a> | <a href="#">Đăng ký</a>
      </p>
    </div>
  </body>
</html>
