<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Đăng Ký</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        height: 100vh;
      }

      .blur-bg {
        backdrop-filter: blur(8px);
        background-color: rgb(255, 255, 255);
        border-radius: 20px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      }

      body {
        background: linear-gradient(to right, #74ebd5, #acb6e5);
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .Aula {
        width: 100px;
      }
    </style>
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top">
      <div class="container">
        <a class="navbar-brand" href="home.html">
          <img class="Aula" src="./1-230921155F0X4.png"
        /></a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        ></button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="home.html">Trang chủ </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#courses">Sản phẩm </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#register">Liên hệ </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#contact">Mới </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="signup.html">Đăng ký </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="signup.html">Tìm kiếm </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <div
      class="container d-flex justify-content-center align-items-center min-vh-100"
    >
      \
      <div class="col-md-6 col-lg-5 p-4 blur-bg">
        <h2 class="text-center mb-4">Tạo Tài Khoản</h2>
        <form id="register">
          <div class="mb-3">
            <label for="name" class="form-label">Họ và tên</label>
            <input
              type="text"
              class="form-control rounded-pill"
              id="name"
              name="name"
              placeholder="Nguyễn Hồ Tùng Lâm"
            />
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input
              type="email"
              class="form-control rounded-pill"
              id="email"
              name="email"
              placeholder="email@example.com"
            />
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Mật khẩu</label>
            <input
              type="password"
              class="form-control rounded-pill"
              id="password"
              name="password"
              placeholder="Mật khẩu"
            />
          </div>
          <div class="mb-3">
            <label for="confirm-password" class="form-label"
              >Xác nhận mật khẩu</label
            >
            <input
              type="password"
              class="form-control rounded-pill"
              id="confirmpassword"
              name="confirmpassword"
              placeholder="Nhập lại mật khẩu"
            />
          </div>
          <!-- <button type="submit" class="btn btn-success w-100 rounded-pill">
            Đăng Ký
          </button> -->
          <div class="mt-3 text-center">
            <button type="submit" class="btn btn-primary w-100">Đăng ký</button>
          </div>
        </form>
      </div>
    </div>

    <script src="./register.js"></script>
  </body>
</html>
